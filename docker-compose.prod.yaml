# Production: образ из GHCR + внешний Traefik (сеть web, TLS myresolver).
# На сервере в .env задайте TRAEFIK_NETWORK=web при необходимости и APP_IMAGE.

services:
  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://docsmodule.ru
      - API_URL=https://docsmodule.ru/api
      - ASSET_URL=https://docsmodule.ru
      - SESSION_SECURE_COOKIE=true
      - INERTIA_SSR=true
      - INERTIA_SSR_URL=http://ssr:13714
      - AGENT_SERVER=agent-svc
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=laravel
      - DB_USERNAME=laravel
      - DB_PASSWORD=laravel
    env_file:
      - .env
    depends_on:
      db:
        condition: service_started
    volumes:
      - repos:/var/repos:ro
    networks:
      - default
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-web}
      - "traefik.http.routers.docmodule-web.rule=Host(`docsmodule.ru`)"
      - traefik.http.routers.docmodule-web.entrypoints=${TRAEFIK_ENTRYPOINTS:-websecure}
      - traefik.http.routers.docmodule-web.service=docmodule-app
      - traefik.http.routers.docmodule-web.tls.certresolver=myresolver
      - "traefik.http.routers.docmodule-web-www.rule=Host(`www.docsmodule.ru`)"
      - traefik.http.routers.docmodule-web-www.entrypoints=${TRAEFIK_ENTRYPOINTS:-websecure}
      - traefik.http.routers.docmodule-web-www.service=docmodule-app
      - traefik.http.routers.docmodule-web-www.tls.certresolver=myresolver
      - traefik.http.services.docmodule-app.loadbalancer.server.port=80

  ssr:
    image: ${APP_IMAGE}
    container_name: ssr
    restart: unless-stopped
    command: php artisan inertia:start-ssr
    env_file:
      - .env
    depends_on:
      - app

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_DATABASE:-laravel}
      - POSTGRES_USER=${DB_USERNAME:-laravel}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-laravel}
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
  repos:

networks:
  default:
    name: docmodule
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-web}
