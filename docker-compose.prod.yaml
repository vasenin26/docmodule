services:
  nginx-proxy:
    image: jwilder/nginx-proxy
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./certs:/etc/nginx/certs:rw
      - ./vhost.d:/etc/nginx/vhost.d:rw
      - ./html:/usr/share/nginx/html:rw

  letsencrypt:
    image: nginxproxy/acme-companion
    container_name: nginx-letsencrypt
    environment:
      NGINX_PROXY_CONTAINER: nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/etc/nginx/certs:rw
      - ./vhost.d:/etc/nginx/vhost.d:rw
      - ./html:/usr/share/nginx/html:rw

  app:
    image: ${APP_IMAGE:-ghcr.io/vasenin26/docmodule:latest}
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://docsmodule.ru
      - API_URL=https://docsmodule.ru/api
      - ASSET_URL=https://docsmodule.ru
      - SESSION_SECURE_COOKIE=true
      - INERTIA_SSR=true
      - INERTIA_SSR_URL=http://ssr:13714
      - AGENT_SERVER=agent-svc
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=laravel
      - DB_USERNAME=laravel
      - DB_PASSWORD=laravel
      - VIRTUAL_HOST=docsmodule.ru
      - LETSENCRYPT_HOST=docsmodule.ru
      - LETSENCRYPT_EMAIL=admin@docsmodule.ru
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - repos:/var/repos:ro

  ssr:
    image: ${APP_IMAGE:-ghcr.io/vasenin26/docmodule:latest}
    container_name: ssr
    command: php artisan inertia:start-ssr --port=13714 --host=0.0.0.0

  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=${DB_DATABASE:-laravel}
      - POSTGRES_USER=${DB_USERNAME:-laravel}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-laravel}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pg_data:
  repos:

networks:
  default:
    name: docmodule

