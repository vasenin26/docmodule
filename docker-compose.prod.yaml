services:
  app:
    image: ghcr.io/vasenin26/docmodule:latest
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - repos:/var/repos:ro

  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=${DB_DATABASE:-laravel}
      - POSTGRES_USER=${DB_USERNAME:-laravel}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-laravel}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pg_data:
  repos:

networks:
  default:
    name: docmodule


