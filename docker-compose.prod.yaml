services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    image: docmodule-app:prod
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "8080:80"
    volumes:
      - repos:/var/repos:ro

  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=${DB_DATABASE:-laravel}
      - POSTGRES_USER=${DB_USERNAME:-laravel}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-laravel}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pg_data:
  repos:

networks:
  default:
    name: docmodule


