services:
  app:
    image: ghcr.io/vasenin26/docmodule:latest
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://docsmodule.ru
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=laravel
      - DB_USERNAME=laravel
      - DB_PASSWORD=laravel
      - VITE_API_BASE_URL=http://docsmodule.ru/api
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - repos:/var/repos:ro

  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=${DB_DATABASE:-laravel}
      - POSTGRES_USER=${DB_USERNAME:-laravel}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-laravel}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pg_data:
  repos:

networks:
  default:
    name: docmodule


