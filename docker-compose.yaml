services:
  development:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    volumes:
      - ./app:/app
      - ./repos:/var/repos
      - /home/vasenin26/.gitconfig:/root/.gitconfig:ro
      - /home/vasenin26/.ssh:/root/.ssh:ro
    working_dir: /app
    ports:
      - "80:80"
      - "8000:8000"
      - "5173:5173"
    command: composer run dev
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - VITE_API_BASE_URL=http://localhost:8000/api

  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=${DB_DATABASE:-laravel}
      - POSTGRES_USER=${DB_USERNAME:-laravel}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-laravel}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - default

volumes:
  pg_data: